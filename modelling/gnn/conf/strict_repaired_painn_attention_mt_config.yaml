# Base config for strict repaired multi-target scalar retraining using
# PaiNN + attention + FiLM on HPC@HU repaired payload.
defaults:
  - _self_

model_type: "painn_attention"

wandb_project: "gnn-repaired-fhi-2026"
wandb_entity: "dtts"
wandb_group: "strict-repaired-mt-painn"

# Job names are generated by W&B unless explicitly overridden.
job_name: null

data_file: "/home/physik/speckhad/delta_data_gpu/retraining_2026-09-09/data/legacy_fhi_aims_dedup_corrected_12bp_plus_k_2026-09-10.pt"
strict_repaired_data: true

model:
  num_layers: 3
  hidden_dim: 128
  max_z: 120
  num_cheap_dft_inputs: 12
  num_precision_settings: 13
  num_geo_inputs: 7
  num_rbf: 20
  cutoff: 5.0
  use_film: true

training:
  active_targets: ["energy", "gap", "volume"]
  batch_size: 32
  epochs: 800
  eval_interval: 5
  early_stopping_patience: 10
  early_stopping_min_delta: 1e-5
  learning_rate: 1e-3
  loss_function: "smape"
  early_stop_metric: "Val/sMAPE_Scalar_Mean"
  evaluate_test_at_end: false
  seed: 42

weights:
  delta_e: 1.0
  delta_gap: 1.0
  delta_vol: 1.0
  delta_r: 0.0
  delta_lat: 0.0
